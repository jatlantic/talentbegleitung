name: Deploy to GitHub Pages

# Fallback deploy target — Vercel is primary, so this only runs when you
# start it by hand: Actions tab → "Deploy to GitHub Pages" → Run workflow.
#
# Before the first run, switch Pages on:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
# Note that a Pages site is publicly reachable even from a private repo.
on:
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Work out the base path
        id: base
        run: |
          # user/org site (user.github.io) and custom domains live at the root;
          # a project site is served from /<repo-name>.
          if [[ "${{ github.event.repository.name }}" == *.github.io ]] || [[ -f public/CNAME ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static site
        env:
          GITHUB_PAGES: 'true'
          BASE_PATH: ${{ steps.base.outputs.path }}
          # Optional: add this repo secret so the contact form works here too.
          # Without it the form falls back to opening the visitor's mail client.
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
